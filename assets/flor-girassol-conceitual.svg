<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ilustração conceitual de girassóis</title>
  <desc id="desc">Flores desenhadas à mão em amarelo solar, coral e lilás, com folhas turquesa e contornos azul-petróleo.</desc>
  <defs>
    <linearGradient id="sunPetal" x1="0" y1="-130" x2="0" y2="-28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8E3B2"/>
      <stop offset="1" stop-color="#83CB72"/>
    </linearGradient>
    <linearGradient id="goldPetal" x1="0" y1="-100" x2="0" y2="-25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55B849"/>
      <stop offset="1" stop-color="#347A3C"/>
    </linearGradient>
    <radialGradient id="seedHeart" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(-14 -17) rotate(49) scale(77)">
      <stop stop-color="#347A3C"/>
      <stop offset="1" stop-color="#172B1C"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83CB72"/>
      <stop offset="1" stop-color="#55B849"/>
    </linearGradient>
    <g id="petal">
      <path d="M0-34C-18-48-29-81-22-108C-18-125-8-140 1-139C12-138 22-117 24-99C28-73 18-47 0-34Z" fill="url(#sunPetal)" stroke="#172B1C" stroke-width="4" stroke-linejoin="round"/>
      <path d="M1-47C-6-67-8-93-3-113" stroke="#E7EEDF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    </g>
    <g id="littlePetal">
      <path d="M0-24C-15-35-22-60-16-80C-12-93-4-104 3-103C12-101 19-85 20-70C22-52 13-33 0-24Z" fill="#C8E3B2" stroke="#172B1C" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Tall stems and broad, loose leaves -->
  <path d="M424 207C424 285 406 354 380 466M434 219C456 293 500 367 539 451M261 282C257 346 276 395 304 465" stroke="#172B1C" stroke-width="12" stroke-linecap="round"/>
  <path d="M401 328C358 278 303 279 275 301C295 341 343 362 397 348C366 351 336 337 315 318" fill="url(#leaf)" stroke="#172B1C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M461 314C507 266 565 272 590 299C566 340 522 357 467 337C500 343 532 331 552 313" fill="url(#leaf)" stroke="#172B1C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M288 373C250 340 210 347 192 368C214 400 245 411 287 393C262 400 239 393 221 380" fill="#C8E3B2" stroke="#172B1C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M513 384C551 348 592 355 610 378C588 409 556 420 514 402C539 409 563 401 581 389" fill="#C8E3B2" stroke="#172B1C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main sunflower; deliberately irregular petal rotations keep the hand-drawn feel -->
  <g transform="translate(428 184) rotate(-3)">
    <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(30)"/>
    <use href="#petal" transform="rotate(60)"/><use href="#petal" transform="rotate(90)"/>
    <use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(150)"/>
    <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(210)"/>
    <use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(270)"/>
    <use href="#petal" transform="rotate(300)"/><use href="#petal" transform="rotate(330)"/>
    <circle r="55" fill="url(#seedHeart)" stroke="#172B1C" stroke-width="5"/>
    <g fill="#55B849">
      <circle cx="-22" cy="-18" r="4"/><circle cx="-2" cy="-28" r="3.5"/><circle cx="19" cy="-20" r="4"/>
      <circle cx="29" cy="-1" r="3.5"/><circle cx="17" cy="20" r="4"/><circle cx="-4" cy="28" r="3.5"/>
      <circle cx="-25" cy="17" r="4"/><circle cx="-34" cy="-1" r="3"/><circle cx="0" cy="-7" r="3"/>
      <circle cx="-11" cy="7" r="3.5"/><circle cx="11" cy="9" r="3"/><circle cx="2" cy="40" r="3"/>
    </g>
  </g>

  <!-- Smaller coral bloom peeking in at left -->
  <g transform="translate(205 250) rotate(8)">
    <use href="#littlePetal" transform="rotate(0)"/><use href="#littlePetal" transform="rotate(45)"/>
    <use href="#littlePetal" transform="rotate(90)"/><use href="#littlePetal" transform="rotate(135)"/>
    <use href="#littlePetal" transform="rotate(180)"/><use href="#littlePetal" transform="rotate(225)"/>
    <use href="#littlePetal" transform="rotate(270)"/><use href="#littlePetal" transform="rotate(315)"/>
    <circle r="33" fill="#55B849" stroke="#172B1C" stroke-width="4"/>
    <circle cx="-9" cy="-7" r="3" fill="#172B1C"/><circle cx="8" cy="-10" r="3" fill="#172B1C"/>
    <circle cx="13" cy="7" r="3" fill="#172B1C"/><circle cx="-5" cy="12" r="3" fill="#172B1C"/>
  </g>

  <!-- A final little yellow bloom balances the right edge -->
  <g transform="translate(660 355) rotate(-7)">
    <path d="M0 30C3 74 1 106-9 143" stroke="#172B1C" stroke-width="9" stroke-linecap="round"/>
    <path d="M-2 88C-34 58-66 63-79 82C-61 107-35 114-1 101M-2 88C-25 86-43 81-58 73" fill="#83CB72" stroke="#172B1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#littlePetal" transform="rotate(0) scale(.88)"/><use href="#littlePetal" transform="rotate(60) scale(.88)"/>
    <use href="#littlePetal" transform="rotate(120) scale(.88)"/><use href="#littlePetal" transform="rotate(180) scale(.88)"/>
    <use href="#littlePetal" transform="rotate(240) scale(.88)"/><use href="#littlePetal" transform="rotate(300) scale(.88)"/>
    <circle r="29" fill="#C8E3B2" stroke="#172B1C" stroke-width="4"/>
    <circle cx="-8" cy="-4" r="3" fill="#55B849"/><circle cx="9" cy="-9" r="3" fill="#55B849"/>
    <circle cx="10" cy="8" r="3" fill="#55B849"/><circle cx="-9" cy="11" r="3" fill="#55B849"/>
  </g>

  <!-- Hand-drawn seed and sun flecks -->
  <path d="M725 95C743 74 759 68 776 73C771 93 754 105 728 101C744 99 757 91 764 81" fill="#83CB72" stroke="#172B1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 151C139 138 146 128 155 120M122 175C110 176 99 179 89 185M153 177C162 183 170 190 176 200" stroke="#347A3C" stroke-width="7" stroke-linecap="round"/>
  <path d="M753 245C765 238 775 232 785 221M770 268C782 269 793 271 804 277" stroke="#C8E3B2" stroke-width="6" stroke-linecap="round"/>
  <circle cx="122" cy="407" r="8" fill="#C8E3B2"/><circle cx="724" cy="156" r="6" fill="#C8E3B2"/>
</svg>
