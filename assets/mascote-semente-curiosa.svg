<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Semente curiosa</title>
  <desc id="desc">Personagem original em forma de semente, com broto, bolsa de sementes verde e lupa com uma folha.</desc>
  <g stroke="#172b1c" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sprout: three bold leaves form a recognizable silhouette at small sizes. -->
    <path d="M177 92C144 81 136 51 143 29c27 3 45 20 46 52 9-39 37-53 65-48-1 31-22 52-62 62" fill="#c8e3b2" stroke-width="8"/>
    <path d="M186 91c-4-30-15-48-34-58M190 91c14-24 30-38 51-44" fill="none" stroke-width="5"/>
    <!-- Seed body. -->
    <path d="M91 178c0-54 39-94 91-94s91 40 91 94c0 77-38 132-91 132s-91-55-91-132Z" fill="#55b849" stroke-width="9"/>
    <path d="M108 188c9-47 34-73 74-73s66 26 74 73c7 47-18 90-74 90s-82-43-74-90Z" fill="#83cb72" stroke="none"/>
    <!-- Face. -->
    <ellipse cx="151" cy="181" rx="18" ry="23" fill="#fff" stroke-width="6"/>
    <ellipse cx="216" cy="181" rx="18" ry="23" fill="#fff" stroke-width="6"/>
    <circle cx="156" cy="186" r="8" fill="#172b1c" stroke="none"/>
    <circle cx="211" cy="186" r="8" fill="#172b1c" stroke="none"/>
    <circle cx="158" cy="183" r="2.5" fill="#fff" stroke="none"/>
    <circle cx="213" cy="183" r="2.5" fill="#fff" stroke="none"/>
    <path d="M166 219c9 11 24 11 34 0" fill="none" stroke-width="6"/>
    <ellipse cx="128" cy="213" rx="10" ry="6" fill="#c8e3b2" stroke="none"/>
    <ellipse cx="239" cy="213" rx="10" ry="6" fill="#c8e3b2" stroke="none"/>
    <!-- Small seed freckles. -->
    <circle cx="126" cy="151" r="5" fill="#c8e3b2" stroke="none"/>
    <circle cx="246" cy="158" r="4" fill="#c8e3b2" stroke="none"/>
    <circle cx="126" cy="238" r="4" fill="#c8e3b2" stroke="none"/>
    <circle cx="245" cy="244" r="5" fill="#c8e3b2" stroke="none"/>
    <!-- Arms and feet. -->
    <path d="M102 222 68 244m190-21 28 18" fill="none" stroke-width="11"/>
    <path d="M139 296 129 326m84-30 12 30" fill="none" stroke-width="12"/>
    <path d="M113 327h28m74 0h27" fill="none" stroke-width="13"/>
    <!-- Coral explorer satchel. -->
    <path d="M207 238c-9 29-26 42-51 47" fill="none" stroke="#c8e3b2" stroke-width="10"/>
    <path d="M164 264c11-8 27-5 33 6l5 23c-13 9-30 9-43 0l2-20c0-4 1-7 3-9Z" fill="#c8e3b2" stroke-width="6"/>
    <path d="M174 281h16" fill="none" stroke="#fff" stroke-width="4"/>
    <!-- Magnifying glass: explorer's curiosity, not a copy of the reference character. -->
    <circle cx="293" cy="154" r="30" fill="#e7eedf" stroke-width="8"/>
    <circle cx="293" cy="154" r="17" fill="#fff" stroke="none"/>
    <path d="m272 177-27 33" fill="none" stroke-width="11"/>
    <path d="m286 153c5-8 13-8 18-7-1 9-7 14-17 14" fill="none" stroke="#347a3c" stroke-width="5"/>
  </g>
  <path d="M73 274c-17 2-26 14-24 28 15 2 28-7 31-21m211-2c16 0 26 12 24 26-14 3-28-5-32-19" fill="#c8e3b2" stroke="#172b1c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
